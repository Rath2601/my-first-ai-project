spring.application.name=my-first-ai-project

# The secret key for calling Google's AI. ${GEMINI_API_KEY} reads it from an
# environment variable so the key is NEVER written in the code or committed to git.
spring.ai.google.genai.api-key=${GEMINI_API_KEY}

# Which AI model to use. "flash" models are the cheaper, faster tier.
spring.ai.google.genai.chat.model=gemini-2.5-flash

# Let the model look things up on the web when answering, so it can use
# up-to-date information instead of only what it learned during training.
spring.ai.google.genai.chat.google-search-retrieval=true

# --- RESILIENCE: what to do when a call fails ---
# LLM providers occasionally return errors or rate-limit you. These settings let
# Spring AI automatically retry instead of failing immediately.
spring.ai.retry.max-attempts=3
# Wait 1s before the first retry...
spring.ai.retry.backoff.initial-interval=1s
# ...then double the wait each time (1s, 2s, 4s). This "backoff" avoids hammering
# a provider that's already struggling.
spring.ai.retry.backoff.multiplier=2
# Only retry on these HTTP errors: 429 = "too many requests", 5xx = server problems.
# Notice 400/401 are absent on purpose — those mean OUR request is wrong, so
# retrying would just waste money making the same broken call again.
spring.ai.retry.on-http-codes=429,500,502,503,504